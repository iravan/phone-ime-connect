    intro:"Run a small app on your computer. It shows a QR code; scan it with your phone (same Wi‑Fi, no app install), type or dictate on the page that opens, and it lands in whatever window has focus — as if you typed it yourself. <strong>No account, no cloud, no phone app.</strong>",

    who5:"<strong>Privacy‑conscious, cross‑ecosystem users</strong> — local, no account, any phone → any desktop OS.",
    beyondTitle:"Beyond the desktop",
    beyond:"<strong>Any device that is a display plus a cursor — but no real keyboard — has the same text‑input problem</strong>, and the same phone‑relay solves it: game consoles (search, passwords, messages), <strong>karaoke machines</strong> (song search, brutal for CJK titles — a phone brings full IME, handwriting, and “just say the song name” voice search), smart TVs, kiosks, VR headsets, car infotainment. Cheap to build, cross‑vendor, zero install. <strong>Stop making on‑screen keyboards less bad — let the phone be the keyboard.</strong><br><br>And it <strong>deploys at scale</strong> — from one desktop to public kiosks, arcade rows, karaoke booths, digital signage, or fleet‑wide shared terminals. <em>Scope: this repository implements only the desktop tool; the consoles, karaoke, kiosks, and larger deployments above are the concept — not included here.</em>",
    readme:"Full setup, troubleshooting, and security details are in the <a href='https://github.com/iravan/phone-ime-connect#readme'>README →</a>",
    fixTitle:"Common problems & fixes", fixIntro:"Almost everyone runs into one or two of these the first time. Tap any item to see exactly what to do.",
    fixReassure:"✅ <strong>These warnings are normal — nothing is wrong and nothing is unsafe.</strong> Your computer is just being cautious about a brand-new app it hasn't seen before. Each fix takes a few seconds, and you only do it once.",
    fix1:"<summary>🪟 Windows: “Windows protected your PC”</summary><div class='body'><p class='why'>This blue box appears for almost every new program that isn't from a big paid publisher. It doesn't mean the app is harmful — Windows simply hasn't seen it downloaded many times yet.</p><ol><li>Click <strong>More info</strong> in the dialog.</li><li>Click the <strong>Run anyway</strong> button that appears.</li></ol><p class='tip'>Prefer not to click through? Right-click the downloaded file → <strong>Properties</strong> → tick <strong>Unblock</strong> → <strong>OK</strong>, then open it normally.</p></div>",
    fix2:"<summary>🍎 macOS: won't open — “Apple could not verify…” or “app is damaged”</summary><div class='body'><p class='why'>Apple charges a yearly fee to “notarize” apps and this project doesn't pay it yet, so macOS is extra cautious. The app is fine — the “damaged” message is misleading. This is a one-time step.</p><ol><li>Drag <strong>PhoneInputConnect</strong> into your <strong>Applications</strong> folder.</li><li>Open <strong>Terminal</strong> and paste these two lines, one at a time:<br><code>xattr -cr /Applications/PhoneInputConnect.app</code><br><code>codesign --force --deep --sign - /Applications/PhoneInputConnect.app</code></li><li>Open the app normally — you won't need to do this again.</li></ol><p class='tip'>The first line removes the “downloaded from the internet” flag; the second re-seals the app for your own Mac. No Terminal? On macOS 14 or earlier, right-click the app → <strong>Open</strong> → <strong>Open</strong>. On macOS 15 Sequoia, double-click once, then <strong>System Settings → Privacy &amp; Security</strong> → scroll down → <strong>Open Anyway</strong>.</p></div>",
    fix3:"<summary>⌨️ macOS: messages arrive but nothing gets typed</summary><div class='body'><p class='why'>To type into your other apps, macOS needs your permission once — the same permission password managers use. It's safe to grant.</p><ol><li>When the “PhoneInputConnect would like to control this computer” prompt appears, click <strong>Open System Settings</strong> — or open <strong>System Settings → Privacy &amp; Security → Accessibility</strong> yourself.</li><li>Turn on the switch next to <strong>PhoneInputConnect</strong>.</li><li>If it was already on, switch it off and on once, then send again.</li></ol></div>",
    fix4:"<summary>🔒 Phone: “Your connection is not private”</summary><div class='body'><p class='why'>The connection <em>is</em> encrypted — your phone just can't verify the certificate because your computer made it itself instead of buying one. On your own Wi-Fi this is safe; it's the same warning many home routers and printers show.</p><ol><li>Tap <strong>Advanced</strong> (or <strong>Show details</strong>).</li><li>Tap <strong>Proceed</strong> / <strong>Continue</strong> to the site.</li></ol><p class='tip'>You'll only see this once per phone.</p></div>",
    fix5:"<summary>📶 Phone can't open the page at all</summary><div class='body'><p class='why'>The QR scanned, but the page won't load. Almost always this means the phone and computer aren't on the same network.</p><ol><li>Put both devices on the <strong>same Wi-Fi</strong> — not a “Guest” network — and turn the phone's <strong>mobile data off</strong> so it doesn't bypass Wi-Fi.</li><li>Still failing? The app may have guessed the wrong network address. Find your computer's Wi-Fi IPv4 address (e.g. <code>192.168.1.42</code>) and launch with <code>PHONE_INPUT_CONNECT_LAN_IP=192.168.1.42</code>.</li></ol></div>",
    fix6:"<summary>🐧 Linux/Wayland: typing silently does nothing</summary><div class='body'><p class='why'>Some Linux desktops (Wayland) don't let apps press keys for you, as a security measure. Nothing the app can change — but your text isn't lost.</p><ol><li>The message is already on your clipboard.</li><li>Click the target window and press <strong>Ctrl+V</strong> yourself.</li></ol><p class='tip'>If GNOME shows an “allow remote desktop interaction” prompt once, allow it and typing works automatically after that.</p></div>",
    fixMore:"Prefer pictures? The <a href='https://github.com/iravan/phone-ime-connect#common-problems--fixes'>README →</a> has a screenshot for every step."

  "zh-Hant":{
    tag:"用手機打字，直接輸入到電腦。",
    download:"下載", github:"在 GitHub 查看",
    intro:"在電腦上執行這個小程式，它會顯示一個 QR code；用手機掃描（同一個 Wi‑Fi、不用安裝任何 App），在開啟的網頁輸入或用說的，內容就會即時輸入到目前作用中的視窗——就像你親手打的一樣。<strong>不需帳號、不經雲端、不用安裝手機程式。</strong>",
    voice:"<strong>最強用途：語音輸入。</strong>按下手機鍵盤的麥克風、開口說，辨識出的文字就會送進<strong>任何</strong>一個電腦程式——編輯器、聊天框、終端機、搜尋列、表單。等於替每個程式加上語音輸入。",
    probTitle:"問題——以及目標",
    prob:"在電腦上，要輸入非純英文的內容很痛苦：切換輸入法、用滑鼠操作手寫板、在候選字裡翻找，或只能對少數支援聽寫的程式說話。<strong>以筆劃、字形為基礎的文字本來就不是為鍵盤而設——一個鍵對得上字母，卻對不上一整個字，所以電腦上每種輸入法其實都只是折衷。</strong>然而你手上最好的鍵盤——你的手機，帶著調校過的輸入法、手寫與語音——卻碰不到電腦上的程式。<strong>目標：讓你的手機能打字進電腦上任何程式，零設定，而且資料完全不離開你的網絡。</strong>",
    nutTitle:"簡單來說",
    nut:"把手機當成電腦的鍵盤。掃描 QR code，在手機上打字（或用說的），文字就會出現在目前作用中的視窗。概念就這麼簡單——完整流程就在下方。",
    nutFlow:"📷 掃描 QR&nbsp;&nbsp;→&nbsp;&nbsp;⌨️ 在手機上打字&nbsp;&nbsp;→&nbsp;&nbsp;💻 出現在電腦上",
    howTitle:"運作原理", howIntro:"一切都在你自己的 Wi‑Fi 上完成，不經雲端。",
    diagTitle:"流程：手機 → 你的電腦 → 作用中的視窗",
    diagPhone:"你的手機", diagApp1:"PhoneInputConnect", diagApp2:"（在你的電腦上）", diagTarget:"作用中的視窗",
    diagArrow1:"① 掃描 QR · 加密 WebSocket", diagArrow2:"② 剪貼簿 + 貼上（Ctrl/Cmd+V）", diagArrow3:"以聊天泡泡回傳",
    step1:"<strong>啟動。</strong>程式開啟一個原生視窗顯示 QR code，並啟動一個只綁定你區域網絡位址、以 TLS 加密的小型網頁伺服器。",
    step2:"<strong>配對。</strong>用手機相機掃描 QR。網址帶有 256 位元 token；手機開啟由你電腦提供的聊天頁面。",
    step3:"<strong>連線。</strong>手機建立 WebSocket，驗證 token 後立即更換，讓 QR 無法被重用。同時只允許一支手機。",
    step4:"<strong>輸入或用說的。</strong>送出訊息，會以聊天泡泡回傳到手機，並送往電腦。",
    step5:"<strong>投遞。</strong>先保存你的剪貼簿，把訊息放上剪貼簿並貼到作用中的視窗（Ctrl/Cmd+V），再還原你原本的剪貼簿。",
    step6:"<strong>斷線容忍。</strong>手機若短暫掉線，同一組 QR 約 45 秒內仍有效，可自動重連、無需重掃。",
    secTitle:"安全與隱私", secIntro:"設計上可安全用於一般、不可信的 Wi‑Fi。",
    sec1:"🔒 <strong>僅限本機網絡。</strong>只綁定你的區域網絡位址、絕不用 0.0.0.0；找不到位址就拒絕啟動。",
    sec2:"🔐 <strong>全程加密。</strong>採用每位使用者自簽的 TLS 憑證（也就是瀏覽器一次性警告的原因）。",
    sec3:"🎟️ <strong>無法猜到的配對。</strong>256 位元 token，手機一連上就更換，五分鐘未使用即失效。",
    sec4:"🧹 <strong>不留任何資料。</strong>紀錄只是記憶體中最近 10 則的環形緩衝；每次貼上後都還原剪貼簿。",
    whoTitle:"適合誰",
    who1:"<strong>使用中日韓等複雜文字的人</strong>——手機的手寫／筆劃／語音輸入遠比桌面輸入法順手。",
    who6:"<strong>只會手寫的人</strong>——會寫字卻沒學過任何輸入法（拼音、注音、倉頡…）；手機的手寫辨識讓你直接寫，不用背輸入法。",
    who7:"<strong>使用舊電腦的人</strong>——系統已不再內建（或從未有過）你慣用的輸入法；手機補上缺少的輸入方式，電腦端不必安裝任何東西。",
    reqs:"系統需求：macOS 11 以上（Apple Silicon）· Windows 10 以上（64 位元）· Linux x86_64、GTK 4.6 以上。",
    who2:"<strong>手機重度打字者</strong>——多年滑動與預測的肌肉記憶，比實體鍵盤更快。",
    who3:"<strong>想用語音輸入到任何程式的人。</strong>",
    who4:"<strong>有無障礙需求者</strong>——觸控、手寫或語音比鍵盤更輕鬆。",
    who5:"<strong>重視隱私、跨生態系的人</strong>——本機、免帳號，任何手機對任何桌面系統。",
    beyondTitle:"不只桌面電腦",
    beyond:"<strong>任何「有螢幕、有游標、卻沒有好鍵盤」的裝置都有同樣的輸入難題</strong>，同一套手機接力都能解決：遊戲主機（搜尋、帳密、訊息）、<strong>卡拉OK 點歌機</strong>（點歌尤其痛苦，中日韓歌名用遙控器幾乎無解——手機帶來完整輸入法、手寫，甚至「用說的」點歌）、智慧電視、自助機台、VR、車載系統。實作便宜、跨品牌、免安裝。<strong>與其把螢幕鍵盤做得比較不爛，不如讓手機直接當鍵盤。</strong><br><br>而且它也能<strong>大規模部署</strong>：從單台電腦到公共自助機、卡拉OK 包廂、數位看板，甚至整個場館或車隊規模的共用終端。<em>範圍：本專案僅實作「桌面版」；上述遊戲主機、卡拉OK、自助機與更大規模的部署只是概念，並未包含在此。</em>",
    readme:"完整安裝、疑難排解與安全性說明請見 <a href='https://github.com/iravan/phone-ime-connect#readme'>README →</a>",
    fixTitle:"常見問題與解決方法", fixIntro:"幾乎每個人第一次用都會遇到一兩項。點一下任何一項，就會看到清楚的步驟。",
    fixReassure:"✅ <strong>這些警告都很正常——沒有出錯，也不代表有危險。</strong>只是電腦第一次見到這個全新程式，格外謹慎而已。每個處理都只需幾秒，而且一次搞定，之後不會再出現。",
    fix1:"<summary>🪟 Windows：「Windows 已保護您的電腦」</summary><div class='body'><p class='why'>幾乎所有不是大公司付費發行的新程式，都會跳出這個藍色視窗。這不代表程式有害——只是 Windows 還沒見過它被大量下載而已。</p><ol><li>在對話框按 <strong>更多資訊</strong>。</li><li>按接著出現的 <strong>仍要執行</strong>。</li></ol><p class='tip'>不想逐步點？在下載的檔案上按右鍵 → <strong>內容</strong> → 勾選 <strong>解除封鎖</strong> → <strong>確定</strong>，之後正常打開即可。</p></div>",
    fix2:"<summary>🍎 macOS：無法開啟——「Apple 無法驗證…」或「App 已損毀」</summary><div class='body'><p class='why'>Apple 要收年費替 App「公證」，本專案暫時未付，所以 macOS 特別謹慎。程式本身沒問題——「已損毀」是誤導的訊息。這只需做一次。</p><ol><li>把 <strong>PhoneInputConnect</strong> 拖進 <strong>「應用程式」</strong> 資料夾。</li><li>打開 <strong>「終端機」</strong>，把以下兩行逐一貼上執行：<br><code>xattr -cr /Applications/PhoneInputConnect.app</code><br><code>codesign --force --deep --sign - /Applications/PhoneInputConnect.app</code></li><li>之後正常打開程式即可，不用再做一次。</li></ol><p class='tip'>第一行清除「從網際網路下載」的標記；第二行替你這部 Mac 重新簽署程式。不想用終端機？macOS 14 或更早：在程式上按右鍵 → <strong>打開</strong> → <strong>打開</strong>。macOS 15 Sequoia：先雙擊一次，再到 <strong>系統設定 → 私隱與安全性</strong> → 往下捲 → <strong>仍要打開</strong>。</p></div>",
    fix3:"<summary>⌨️ macOS：訊息送到了，但沒有打出文字</summary><div class='body'><p class='why'>要把文字輸入到你的其他 App，macOS 需要你授權一次——就跟密碼管理程式用的權限一樣，可以放心開啟。</p><ol><li>當「PhoneInputConnect 想要控制這部電腦」的提示出現時，按 <strong>打開系統設定</strong>；或自己到 <strong>系統設定 → 私隱與安全性 → 輔助使用</strong>。</li><li>把 <strong>PhoneInputConnect</strong> 旁邊的開關打開。</li><li>如果本來就已開啟，把它關掉再開一次，然後再送一次訊息。</li></ol></div>",
    fix4:"<summary>🔒 手機：「你的連線並不安全」</summary><div class='body'><p class='why'>連線<em>其實</em>已加密——只是憑證是電腦自己簽發、而非向外購買，所以手機無法核實。在自己的 Wi-Fi 上是安全的；很多家用路由器和打印機也會顯示同樣的警告。</p><ol><li>按 <strong>進階</strong>（或 <strong>顯示詳細資料</strong>）。</li><li>按 <strong>繼續前往</strong> 該網站。</li></ol><p class='tip'>每部手機只會出現一次。</p></div>",
    fix5:"<summary>📶 手機完全打不開網頁</summary><div class='body'><p class='why'>QR 掃到了，網頁卻載入不了。幾乎都是因為手機和電腦不在同一個網絡。</p><ol><li>把兩部裝置連到 <strong>同一個 Wi-Fi</strong>——不要用「訪客」網絡——並把手機的 <strong>流動數據關掉</strong>，以免繞過 Wi-Fi。</li><li>還是不行？程式可能猜錯了網絡位址。找出電腦的 Wi-Fi IPv4 位址（例如 <code>192.168.1.42</code>），啟動時加上 <code>PHONE_INPUT_CONNECT_LAN_IP=192.168.1.42</code>。</li></ol></div>",
    fix6:"<summary>🐧 Linux／Wayland：打字沒有任何反應</summary><div class='body'><p class='why'>部分 Linux 桌面（Wayland）基於保安，不允許程式代你按鍵。這是程式無法改變的——但你的文字並沒有不見。</p><ol><li>訊息其實已經在剪貼簿上。</li><li>點一下目標視窗，自己按 <strong>Ctrl+V</strong>。</li></ol><p class='tip'>若 GNOME 曾跳出一次「允許遠端桌面互動」的提示，允許它，之後就會自動輸入。</p></div>",
    fixMore:"想看圖？<a href='https://github.com/iravan/phone-ime-connect#common-problems--fixes'>README →</a> 每個步驟都附有截圖。"
  },

    who6:"<strong>只会手写的人</strong>——会写字却没学过任何输入法（拼音、注音、仓颉…）；手机的手写识别让你直接写，不用背输入法。",
    who7:"<strong>使用旧电脑的人</strong>——系统已不再内置（或从未有过）你惯用的输入法；手机补上缺少的输入方式，电脑端无需安装任何东西。",

    who5:"<strong>重视隐私、跨生态系统的人</strong>——本地、免账号，任何手机对任何桌面系统。",
    beyondTitle:"不只桌面电脑",
    beyond:"<strong>任何“有屏幕、有光标、却没有好键盘”的设备都有同样的输入难题</strong>，同一套手机接力都能解决：游戏主机（搜索、账号密码、消息）、<strong>卡拉OK 点歌机</strong>（点歌尤其痛苦，中日韩歌名用遥控器几乎无解——手机带来完整输入法、手写，甚至“用说的”点歌）、智能电视、自助机、VR、车载系统。实现便宜、跨品牌、免安装。<strong>与其把屏幕键盘做得没那么烂，不如让手机直接当键盘。</strong><br><br>而且它也能<strong>大规模部署</strong>：从单台电脑到公共自助机、卡拉OK 包厢、数字看板，甚至整个场馆或车队规模的共用终端。<em>范围：本项目仅实现“桌面版”；上述游戏主机、卡拉OK、自助机与更大规模的部署只是概念，并未包含在此。</em>",
    readme:"完整安装、疑难排解与安全性说明请见 <a href='https://github.com/iravan/phone-ime-connect#readme'>README →</a>",
    fixTitle:"常见问题与解决方法", fixIntro:"几乎每个人第一次用都会遇到一两项。点一下任何一项，就会看到清楚的步骤。",
    fixReassure:"✅ <strong>这些警告都很正常——没有出错，也不代表有危险。</strong>只是电脑第一次见到这个全新程序，格外谨慎而已。每个处理都只需几秒，而且一次搞定，之后不会再出现。",
    fix1:"<summary>🪟 Windows：“Windows 已保护你的电脑”</summary><div class='body'><p class='why'>几乎所有不是大公司付费发行的新程序，都会弹出这个蓝色窗口。这不代表程序有害——只是 Windows 还没见过它被大量下载而已。</p><ol><li>在对话框点 <strong>更多信息</strong>。</li><li>点接着出现的 <strong>仍要运行</strong>。</li></ol><p class='tip'>不想逐步点？在下载的文件上右键 → <strong>属性</strong> → 勾选 <strong>解除锁定</strong> → <strong>确定</strong>，之后正常打开即可。</p></div>",
    fix2:"<summary>🍎 macOS：无法打开——“Apple 无法验证…”或“App 已损坏”</summary><div class='body'><p class='why'>Apple 要收年费替 App“公证”，本项目暂时未付，所以 macOS 特别谨慎。程序本身没问题——“已损坏”是误导的提示。这只需做一次。</p><ol><li>把 <strong>PhoneInputConnect</strong> 拖进 <strong>“应用程序”</strong> 文件夹。</li><li>打开 <strong>“终端”</strong>，把以下两行逐一粘贴执行：<br><code>xattr -cr /Applications/PhoneInputConnect.app</code><br><code>codesign --force --deep --sign - /Applications/PhoneInputConnect.app</code></li><li>之后正常打开程序即可，不用再做一次。</li></ol><p class='tip'>第一行清除“从互联网下载”的标记；第二行替你这台 Mac 重新签名程序。不想用终端？macOS 14 或更早：在程序上右键 → <strong>打开</strong> → <strong>打开</strong>。macOS 15 Sequoia：先双击一次，再到 <strong>系统设置 → 隐私与安全性</strong> → 往下滚 → <strong>仍要打开</strong>。</p></div>",
    fix3:"<summary>⌨️ macOS：消息送到了，但没有打出文字</summary><div class='body'><p class='why'>要把文字输入到你的其他 App，macOS 需要你授权一次——就跟密码管理器用的权限一样，可以放心开启。</p><ol><li>当“PhoneInputConnect 想要控制这台电脑”的提示出现时，点 <strong>打开系统设置</strong>；或自己到 <strong>系统设置 → 隐私与安全性 → 辅助功能</strong>。</li><li>把 <strong>PhoneInputConnect</strong> 旁边的开关打开。</li><li>如果本来就已开启，把它关掉再开一次，然后再发一次消息。</li></ol></div>",
    fix4:"<summary>🔒 手机：“你的连接不是私密连接”</summary><div class='body'><p class='why'>连接<em>其实</em>已加密——只是证书是电脑自己签发、而非对外购买，所以手机无法核实。在自己的 Wi-Fi 上是安全的；很多家用路由器和打印机也会显示同样的警告。</p><ol><li>点 <strong>高级</strong>（或 <strong>显示详情</strong>）。</li><li>点 <strong>继续前往</strong> 该网站。</li></ol><p class='tip'>每部手机只会出现一次。</p></div>",
    fix5:"<summary>📶 手机完全打不开网页</summary><div class='body'><p class='why'>二维码扫到了，网页却加载不出来。几乎都是因为手机和电脑不在同一个网络。</p><ol><li>把两台设备连到 <strong>同一个 Wi-Fi</strong>——不要用“访客”网络——并把手机的 <strong>移动数据关掉</strong>，以免绕过 Wi-Fi。</li><li>还是不行？程序可能猜错了网络地址。找出电脑的 Wi-Fi IPv4 地址（例如 <code>192.168.1.42</code>），启动时加上 <code>PHONE_INPUT_CONNECT_LAN_IP=192.168.1.42</code>。</li></ol></div>",
    fix6:"<summary>🐧 Linux／Wayland：打字没有任何反应</summary><div class='body'><p class='why'>部分 Linux 桌面（Wayland）出于安全，不允许程序代你按键。这是程序无法改变的——但你的文字并没有丢失。</p><ol><li>消息其实已经在剪贴板上。</li><li>点一下目标窗口，自己按 <strong>Ctrl+V</strong>。</li></ol><p class='tip'>若 GNOME 曾弹出一次“允许远程桌面交互”的提示，允许它，之后就会自动输入。</p></div>",
    fixMore:"想看图？<a href='https://github.com/iravan/phone-ime-connect#common-problems--fixes'>README →</a> 每个步骤都附有截图。"

    who6:"<strong>手書きしかできない人</strong>——入力方式（ローマ字・ピンイン・注音…）は覚えていないが手では書ける；スマホの手書き認識でそのまま書けます。",

    beyond:"<strong>画面とカーソルはあるが、まともなキーボードがない機器</strong>はどれも同じ入力問題を抱えます：ゲーム機（検索・パスワード・メッセージ）、<strong>カラオケ</strong>（曲名検索、とくに日中韓の曲名はリモコンではほぼ不可能——スマホなら完全な入力・手書き・「声で曲名」検索まで）、スマート TV、キオスク、VR、車載。実装は安価・機種横断・インストール不要。<strong>画面キーボードを少しマシにするより、スマホをキーボードにしましょう。</strong><br><br>しかも<strong>大規模展開</strong>も可能です：1 台の PC から、公共キオスク、アーケード筐体、カラオケの各ブース、デジタルサイネージ、施設・車両群規模の共用端末まで。<em>スコープ：本リポジトリはデスクトップ版のみを実装。上記のゲーム機・カラオケ・キオスク・大規模展開は概念であり、ここには含まれません。</em>",

    fix1:"<summary>🪟 Windows：「WindowsによってPCが保護されました」</summary><div class='body'><p class='why'>大手の有料発行元でない新しいプログラムには、ほぼ必ずこの青い画面が出ます。アプリが有害という意味ではなく、Windows がまだ広く出回っていないと判断しているだけです。</p><ol><li>ダイアログの <strong>詳細情報</strong> をクリック。</li><li>現れた <strong>実行</strong> ボタンをクリック。</li></ol><p class='tip'>クリックしたくない場合：ダウンロードしたファイルを右クリック → <strong>プロパティ</strong> → <strong>ブロックの解除</strong> にチェック → <strong>OK</strong>。その後は普通に開けます。</p></div>",
    fix2:"<summary>🍎 macOS：開けない——「Appleは確認できません…」または「アプリは壊れています」</summary><div class='body'><p class='why'>Apple はアプリの「公証」に年額費用を課しており、本プロジェクトはまだ支払っていないため macOS が慎重になります。アプリ自体は正常で、「壊れています」は誤解を招く表示です。作業は一度だけです。</p><ol><li><strong>PhoneInputConnect</strong> を <strong>「アプリケーション」</strong> フォルダに移動。</li><li><strong>「ターミナル」</strong> を開き、次の2行を1行ずつ貼り付けて実行：<br><code>xattr -cr /Applications/PhoneInputConnect.app</code><br><code>codesign --force --deep --sign - /Applications/PhoneInputConnect.app</code></li><li>あとは普通に開けます。二度目は不要です。</li></ol><p class='tip'>1行目は「インターネットからダウンロード」の印を消し、2行目はあなたの Mac 用にアプリを署名し直します。ターミナルを使わない場合：macOS 14 以前ならアプリを右クリック → <strong>開く</strong> → <strong>開く</strong>。macOS 15 Sequoia なら一度ダブルクリックし、<strong>システム設定 → プライバシーとセキュリティ</strong> → 下へスクロール → <strong>このまま開く</strong>。</p></div>",
    fix3:"<summary>⌨️ macOS：メッセージは届くのに入力されない</summary><div class='body'><p class='why'>他のアプリへ入力するには、macOS の許可が一度だけ必要です——パスワード管理アプリが使うのと同じ権限で、安全に許可できます。</p><ol><li>「PhoneInputConnect がこのコンピュータの制御を求めています」の表示が出たら <strong>システム設定を開く</strong> をクリック。または自分で <strong>システム設定 → プライバシーとセキュリティ → アクセシビリティ</strong> を開く。</li><li><strong>PhoneInputConnect</strong> のスイッチをオンに。</li><li>すでにオンなら、一度オフにして再度オンにし、もう一度送信。</li></ol></div>",
    fix4:"<summary>🔒 スマホ：「この接続ではプライバシーが保護されません」</summary><div class='body'><p class='why'>通信は<em>暗号化されています</em>——証明書を購入せず PC が自分で作ったため、スマホが確認できないだけです。自分の Wi-Fi 内なら安全で、家庭用ルーターやプリンターでも同じ警告が出ます。</p><ol><li><strong>詳細設定</strong>（または <strong>詳細を表示</strong>）をタップ。</li><li><strong>アクセスする</strong> / <strong>続行</strong> をタップ。</li></ol><p class='tip'>スマホごとに一度だけです。</p></div>",
    fix5:"<summary>📶 スマホでページが全く開かない</summary><div class='body'><p class='why'>QR は読めたのにページが開かない。ほとんどの場合、スマホと PC が同じネットワークにありません。</p><ol><li>両方を <strong>同じ Wi-Fi</strong> に——「ゲスト」ネットワークは不可——スマホの <strong>モバイル通信をオフ</strong> にして Wi-Fi を迂回させない。</li><li>まだ駄目？アドレスの推定を誤った可能性。PC の Wi-Fi の IPv4 アドレス（例：<code>192.168.1.42</code>）を調べ、起動時に <code>PHONE_INPUT_CONNECT_LAN_IP=192.168.1.42</code> を指定。</li></ol></div>",

    prob:"PC에서는 영어가 아닌 텍스트 입력이 고통스럽습니다: 입력기 전환, 마우스로 손글씨 패드 조작, 후보 목록 뒤지기, 혹은 받아쓰기를 지원하는 일부 앱에서만 음성 입력. <strong>획과 자형에 기반한 문자는 애초에 키보드용으로 만들어지지 않았습니다 — 키는 알파벳에는 대응해도 한 글자에는 대응하지 못해, 컴퓨터의 어떤 입력기든 사실상 우회책일 뿐입니다.</strong> 그런데 정작 가장 좋은 키보드——잘 다듬어진 IME·손글씨·음성을 갖춘 당신의 휴대폰——은 PC의 앱에 닿지 못합니다. <strong>목표: 휴대폰으로 PC의 어떤 프로그램에든 입력하기. 설정은 전혀 없이, 데이터는 네트워크 밖으로 절대 나가지 않습니다.</strong>",

    howTitle:"작동 방식", howIntro:"모든 것이 내 Wi‑Fi 안에서 이루어지며, 클라우드로 나가지 않습니다.",

    secTitle:"보안 & 프라이버시", secIntro:"신뢰할 수 없는 일반 Wi‑Fi에서도 안전하도록 설계.",
    sec1:"🔒 <strong>로컬 전용.</strong> LAN 주소에만 바인딩하고 0.0.0.0은 쓰지 않으며, 없으면 시작을 거부합니다.",

    whoTitle:"이런 분께",
    who1:"<strong>중국어·일본어·한국어 등 복잡한 문자 사용자</strong>——손글씨·획·음성은 휴대폰이 훨씬 편합니다.",

    who3:"<strong>어떤 앱에든 음성으로 입력하고 싶은 분.</strong>",

    beyondTitle:"데스크톱만이 아닙니다",
    beyond:"<strong>화면과 커서는 있지만 제대로 된 키보드가 없는 기기</strong>는 모두 같은 입력 문제를 겪습니다: 게임 콘솔(검색·비밀번호·메시지), <strong>노래방 기기</strong>(곡 검색, 특히 중·일·한 곡명은 리모컨으로 사실상 불가능——휴대폰이면 완전한 입력·손글씨·“음성으로 곡명” 검색까지), 스마트 TV, 키오스크, VR, 차량 인포테인먼트. 구현이 저렴하고 기기 무관하며 설치가 필요 없습니다. <strong>화면 키보드를 덜 나쁘게 만들기보다, 휴대폰을 키보드로 삼으세요.</strong><br><br>게다가 <strong>대규모로 배포</strong>할 수도 있습니다: PC 한 대에서 공공 키오스크, 아케이드 기기, 노래방 각 룸, 디지털 사이니지, 시설·차량군 규모의 공용 단말까지. <em>범위: 이 저장소는 데스크톱 버전만 구현합니다. 위의 게임 콘솔·노래방·키오스크·대규모 배포는 개념이며 여기 포함되지 않습니다.</em>",
    readme:"자세한 설치·문제 해결·보안 내용은 <a href='https://github.com/iravan/phone-ime-connect#readme'>README →</a>",
    fixTitle:"자주 겪는 문제와 해결", fixIntro:"처음엔 거의 누구나 한두 개를 만납니다. 항목을 누르면 정확한 순서가 열립니다.",
    fixReassure:"✅ <strong>이 경고들은 정상입니다 — 문제가 있거나 위험한 게 아닙니다.</strong> 컴퓨터가 처음 보는 새 앱이라 조심하는 것뿐입니다. 각 해결은 몇 초면 되고, 처음 한 번만 하면 됩니다.",
    fix1:"<summary>🪟 Windows: “Windows에서 PC를 보호했습니다”</summary><div class='body'><p class='why'>대형 유료 배포사가 아닌 새 프로그램은 거의 모두 이 파란 창이 뜹니다. 앱이 해롭다는 뜻이 아니라, Windows가 아직 많이 내려받아진 걸 못 봤을 뿐입니다.</p><ol><li>대화상자에서 <strong>추가 정보</strong>를 클릭.</li><li>나타나는 <strong>실행</strong> 버튼을 클릭.</li></ol><p class='tip'>일일이 누르기 싫다면: 내려받은 파일 우클릭 → <strong>속성</strong> → <strong>차단 해제</strong> 체크 → <strong>확인</strong> 후 평소처럼 열면 됩니다.</p></div>",
    fix2:"<summary>🍎 macOS: 열리지 않음 — “Apple에서 확인할 수 없음…” 또는 “앱이 손상됨”</summary><div class='body'><p class='why'>Apple은 앱 “공증”에 연회비를 받는데 이 프로젝트는 아직 내지 않아 macOS가 더 조심합니다. 앱은 멀쩡하며 “손상됨”은 오해를 주는 문구입니다. 한 번만 하면 됩니다.</p><ol><li><strong>PhoneInputConnect</strong>를 <strong>응용 프로그램</strong> 폴더로 옮깁니다.</li><li><strong>터미널</strong>을 열고 아래 두 줄을 한 줄씩 붙여 실행:<br><code>xattr -cr /Applications/PhoneInputConnect.app</code><br><code>codesign --force --deep --sign - /Applications/PhoneInputConnect.app</code></li><li>이제 평소처럼 열면 됩니다. 다시 할 필요 없습니다.</li></ol><p class='tip'>첫 줄은 “인터넷에서 다운로드” 표시를 지우고, 둘째 줄은 이 Mac용으로 앱을 다시 서명합니다. 터미널이 싫다면: macOS 14 이하는 앱 우클릭 → <strong>열기</strong> → <strong>열기</strong>. macOS 15 Sequoia는 한 번 더블클릭한 뒤 <strong>시스템 설정 → 개인정보 보호 및 보안</strong> → 아래로 스크롤 → <strong>그래도 열기</strong>.</p></div>",
    fix3:"<summary>⌨️ macOS: 메시지는 오는데 입력되지 않음</summary><div class='body'><p class='why'>다른 앱에 입력하려면 macOS 권한이 한 번 필요합니다 — 비밀번호 관리자가 쓰는 것과 같은 권한이라 안심하고 허용해도 됩니다.</p><ol><li>“PhoneInputConnect이(가) 이 컴퓨터를 제어하려고 합니다” 안내가 뜨면 <strong>시스템 설정 열기</strong>를 클릭. 또는 직접 <strong>시스템 설정 → 개인정보 보호 및 보안 → 손쉬운 사용</strong>으로 이동.</li><li><strong>PhoneInputConnect</strong> 옆 스위치를 켭니다.</li><li>이미 켜져 있었다면, 한 번 껐다 켠 뒤 다시 보내 보세요.</li></ol></div>",
    fix4:"<summary>🔒 휴대폰: “연결이 비공개로 설정되어 있지 않습니다”</summary><div class='body'><p class='why'>연결은 <em>암호화되어 있습니다</em> — 인증서를 사서 쓰지 않고 컴퓨터가 직접 만든 것이라 휴대폰이 확인만 못 할 뿐입니다. 내 Wi-Fi에서는 안전하며, 가정용 공유기·프린터에서도 같은 경고가 뜹니다.</p><ol><li><strong>고급</strong>(또는 <strong>세부정보 표시</strong>)을 탭.</li><li>사이트로 <strong>계속</strong> / <strong>이동</strong>을 탭.</li></ol><p class='tip'>휴대폰마다 한 번만 나옵니다.</p></div>",
    fix5:"<summary>📶 휴대폰에서 페이지가 아예 안 열림</summary><div class='body'><p class='why'>QR은 읽혔는데 페이지가 안 열립니다. 거의 항상 휴대폰과 컴퓨터가 같은 네트워크가 아니어서입니다.</p><ol><li>두 기기를 <strong>같은 Wi-Fi</strong>에 — “게스트” 네트워크는 안 됨 — 그리고 휴대폰 <strong>모바일 데이터를 끄기</strong>(Wi-Fi를 우회하지 않도록).</li><li>그래도 안 되면 주소를 잘못 추정했을 수 있습니다. 컴퓨터의 Wi-Fi IPv4 주소(예: <code>192.168.1.42</code>)를 찾아 실행 시 <code>PHONE_INPUT_CONNECT_LAN_IP=192.168.1.42</code>로 지정하세요.</li></ol></div>",
    fix6:"<summary>🐧 Linux／Wayland: 입력해도 아무 일이 없음</summary><div class='body'><p class='why'>일부 Linux 데스크톱(Wayland)은 보안상 앱이 대신 키를 누르는 걸 막습니다. 앱이 바꿀 수 없는 부분이지만, 글자가 사라진 건 아닙니다.</p><ol><li>메시지는 이미 클립보드에 있습니다.</li><li>대상 창을 클릭하고 직접 <strong>Ctrl+V</strong>를 누르세요.</li></ol><p class='tip'>GNOME에서 “원격 데스크톱 상호작용 허용” 안내가 한 번 뜨면 허용하세요. 이후에는 자동으로 입력됩니다.</p></div>",
    fixMore:"그림으로 보고 싶다면 <a href='https://github.com/iravan/phone-ime-connect#common-problems--fixes'>README →</a>에 단계별 스크린샷이 있습니다."
  }
};

(function(){
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var have = tabs.map(function(t){return t.dataset.lang;});
  function apply(lang){
    var d = I18N[lang] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = d[el.getAttribute('data-i18n')];
      if(v==null) return;
      // SVG <text>/<title> take plain text; everything else may contain markup.
      if(el.namespaceURI && el.namespaceURI.indexOf('svg')>=0) el.textContent = v;
      else el.innerHTML = v;
    });
    tabs.forEach(function(t){ t.setAttribute('aria-selected', t.dataset.lang===lang); });
    document.documentElement.lang = lang;
    try{ localStorage.setItem('pic_lang', lang); }catch(e){}
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ apply(t.dataset.lang); }); });
  var saved; try{ saved = localStorage.getItem('pic_lang'); }catch(e){}
  var nav = (navigator.language||'en');
  var guess = nav.indexOf('zh')===0 ? (/hans|^zh-cn|^zh-sg/i.test(nav)?'zh-Hans':'zh-Hant')
            : nav.indexOf('ja')===0 ? 'ja'
            : nav.indexOf('ko')===0 ? 'ko' : 'zh-Hant';
  apply(have.indexOf(saved)>=0 ? saved : guess);
})();
</script>
