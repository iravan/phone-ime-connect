<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneInputConnect — type on your computer from your phone</title>
<meta name="description" content="Type on your computer by texting it from your phone. Scan a QR code, type or dictate on your phone, and it lands in the focused window. No account, no cloud, no app.">
<link rel="icon" href="icon-256.png">
<style>

    --accent2:#7b5cff; --accent-fg:#fff; --ok:#37d399; --code:#0f1620;

  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f7fb; --bg2:#eef2f8; --panel:#fff; --panel2:#f3f6fb;
      --border:#dbe2ec; --fg:#1c2430; --muted:#5a6a7d; --code:#eef2f7;
      --shadow:0 10px 34px rgba(30,50,90,.10); }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:
      radial-gradient(1200px 600px at 50% -200px, rgba(79,140,255,.18), transparent 60%),
      var(--bg);
    color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",
    "Noto Sans CJK TC","Noto Sans CJK SC","Noto Sans CJK JP","Noto Sans CJK KR",
    "PingFang TC","PingFang SC","Hiragino Sans","Microsoft JhengHei","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* hero */
  header{text-align:center;padding:64px 20px 12px}
  .logo{width:88px;height:88px;border-radius:22px;box-shadow:var(--shadow)}
  h1{font-size:2.3rem;margin:.6rem 0 .2rem;letter-spacing:-.03em;
    background:linear-gradient(120deg,var(--fg),var(--accent));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .tag{color:var(--muted);font-size:1.18rem;margin:.2rem auto 0;max-width:32ch}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:24px 0 4px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:11px;
    font-weight:650;border:1px solid var(--border);color:var(--fg);background:var(--panel);
    transition:transform .12s ease, box-shadow .12s ease}
  .btn:hover{transform:translateY(-1px);text-decoration:none;box-shadow:var(--shadow)}
  .btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent2));
    color:var(--accent-fg);border-color:transparent}

  /* language tabs */
  .tabs{position:sticky;top:0;z-index:10;display:flex;gap:6px;flex-wrap:wrap;
    justify-content:center;padding:12px 0;margin:20px 0 6px;
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .tab{cursor:pointer;padding:8px 15px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel);color:var(--fg);font-size:.95rem;font-weight:650;
    transition:all .12s ease}
  .tab:hover{border-color:var(--accent)}
  .tab[aria-selected="true"]{background:linear-gradient(120deg,var(--accent),var(--accent2));
    color:var(--accent-fg);border-color:transparent}

  section{margin:40px 0}
  h2{font-size:1.5rem;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 20px}
  .lead{font-size:1.08rem}
  .flow-abstract{font-size:1.12rem;font-weight:650;text-align:center;line-height:1.9;
    background:linear-gradient(120deg,var(--panel),var(--panel2));border:1px solid var(--border);
    border-radius:14px;padding:18px 20px;margin-top:14px;box-shadow:var(--shadow)}
  .callout{background:linear-gradient(120deg,var(--panel),var(--panel2));
    border:1px solid var(--border);border-left:4px solid var(--accent);
    border-radius:14px;padding:16px 20px;margin:22px 0;box-shadow:var(--shadow)}

  /* diagram */
  .diagram{background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:18px;box-shadow:var(--shadow);overflow:hidden}
  .diagram svg{width:100%;height:auto;display:block}
  .node rect{fill:var(--panel2);stroke:var(--border)}
  .node .glyph{font-size:30px}
  .node text{fill:var(--fg)}
  .flowlabel{fill:var(--muted);font-size:11.5px}
  .wire{stroke:var(--accent);stroke-width:2.2;fill:none}
  .wire.dash{stroke:var(--muted);stroke-dasharray:5 5;stroke-width:1.6}
  .packet{fill:var(--accent)}
  .packet.b{fill:var(--accent2)}
  @keyframes flow1{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(236px);opacity:0}}
  @keyframes flow2{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(236px);opacity:0}}
  .p1{animation:flow1 2.4s ease-in-out infinite}
  .p2{animation:flow2 2.4s ease-in-out infinite;animation-delay:1.2s}
  @media (prefers-reduced-motion: reduce){.p1,.p2{animation:none;opacity:.9}}

  /* step + card grids */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:8px}
  .step{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;position:relative}
  .step .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;
    font-weight:800;color:var(--accent-fg);background:linear-gradient(120deg,var(--accent),var(--accent2));margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
  ul.who{padding-left:1.2em}
  ul.who li{margin:.4em 0}
  .note{color:var(--muted);font-size:.95rem;margin-top:14px}

  footer{text-align:center;color:var(--muted);margin:56px 0 40px;font-size:.9rem}
  hr{border:none;border-top:1px solid var(--border);margin:8px 0}
  [hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <img class="logo" src="icon-256.png" alt="PhoneInputConnect logo">
  <h1>PhoneInputConnect</h1>
  <p class="tag" data-i18n="tag"></p>
  <div class="cta">
    <a class="btn primary" href="https://github.com/iravan/phone-ime-connect/releases"><span>⬇</span><span data-i18n="download"></span></a>
    <a class="btn" href="https://github.com/iravan/phone-ime-connect"><span>★</span><span data-i18n="github"></span></a>
  </div>
</header>

<div class="tabs" role="tablist" aria-label="Language">
  <button class="tab" role="tab" data-lang="en">English</button>
  <button class="tab" role="tab" data-lang="zh-Hant">繁體中文</button>
  <button class="tab" role="tab" data-lang="zh-Hans">简体中文</button>
  <button class="tab" role="tab" data-lang="ja">日本語</button>
  <button class="tab" role="tab" data-lang="ko">한국어</button>
</div>

<div class="wrap">

  <section>
    <p class="lead" data-i18n="intro"></p>
    <div class="callout" data-i18n="voice"></div>
  </section>

  <!-- PROBLEM / GOAL -->
  <section>
    <h2 data-i18n="probTitle"></h2>
    <p data-i18n="prob"></p>
  </section>

  <!-- IN A NUTSHELL (abstract how-it-works) -->
  <section>
    <h2 data-i18n="nutTitle"></h2>
    <p class="lead" data-i18n="nut"></p>
    <p class="flow-abstract" data-i18n="nutFlow"></p>
  </section>

  <!-- MECHANISM -->
  <section>
    <h2 data-i18n="howTitle"></h2>
    <p class="sub" data-i18n="howIntro"></p>

    <div class="diagram">
      <svg viewBox="0 0 1000 300" role="img" aria-labelledby="diagt">
        <title id="diagt" data-i18n="diagTitle"></title>

        <defs>
          <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--accent)"/>
          </marker>
          <marker id="arwm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
            <path d="M0 0 L9 4.5 L0 9 z" fill="var(--muted)"/>
          </marker>
        </defs>

        <!-- nodes first, so labels drawn later stay on top -->
        <g class="node">
          <rect x="20" y="72" width="150" height="150" rx="16"/>
          <text class="glyph" x="95" y="132" text-anchor="middle">📱</text>
          <text x="95" y="174" text-anchor="middle" font-size="13" data-i18n="diagPhone"></text>
        </g>
        <g class="node">
          <rect x="410" y="56" width="180" height="182" rx="16"/>
          <text class="glyph" x="500" y="120" text-anchor="middle">💻</text>
          <text x="500" y="162" text-anchor="middle" font-size="12.5" data-i18n="diagApp1"></text>
          <text x="500" y="182" text-anchor="middle" font-size="11.5" fill="var(--muted)" data-i18n="diagApp2"></text>
        </g>
        <g class="node">
          <rect x="830" y="72" width="150" height="150" rx="16"/>
          <text class="glyph" x="905" y="132" text-anchor="middle">🎯</text>
          <text x="905" y="174" text-anchor="middle" font-size="13" data-i18n="diagTarget"></text>
        </g>

        <!-- wires + moving packets -->
        <path class="wire" d="M170 98 H406" marker-end="url(#arw)"/>
        <path class="wire" d="M590 98 H826" marker-end="url(#arw)"/>
        <path class="wire dash" d="M410 152 H174" marker-end="url(#arwm)"/>
        <circle class="packet p1" cx="170" cy="98" r="5"/>
        <circle class="packet b p2" cx="590" cy="98" r="5"/>

        <!-- labels LAST so nothing paints over them -->
        <text class="flowlabel" x="288" y="84" text-anchor="middle" data-i18n="diagArrow1"></text>
        <text class="flowlabel" x="708" y="84" text-anchor="middle" data-i18n="diagArrow2"></text>
        <text class="flowlabel" x="292" y="172" text-anchor="middle" data-i18n="diagArrow3"></text>
      </svg>
    </div>

    <div class="steps">
      <div class="step"><div class="n">1</div><div data-i18n="step1"></div></div>
      <div class="step"><div class="n">2</div><div data-i18n="step2"></div></div>
      <div class="step"><div class="n">3</div><div data-i18n="step3"></div></div>
      <div class="step"><div class="n">4</div><div data-i18n="step4"></div></div>
      <div class="step"><div class="n">5</div><div data-i18n="step5"></div></div>
      <div class="step"><div class="n">6</div><div data-i18n="step6"></div></div>
    </div>
  </section>

  <!-- SECURITY -->
  <section>
    <h2 data-i18n="secTitle"></h2>
    <p class="sub" data-i18n="secIntro"></p>
    <div class="grid">
      <div class="card" data-i18n="sec1"></div>
      <div class="card" data-i18n="sec2"></div>
      <div class="card" data-i18n="sec3"></div>
      <div class="card" data-i18n="sec4"></div>
    </div>
  </section>

  <!-- WHO -->
  <section>
    <h2 data-i18n="whoTitle"></h2>
    <ul class="who">
      <li data-i18n="who1"></li>
      <li data-i18n="who6"></li>
      <li data-i18n="who2"></li>
      <li data-i18n="who3"></li>
      <li data-i18n="who4"></li>
      <li data-i18n="who5"></li>
    </ul>
  </section>

  <!-- BEYOND -->
  <section>
    <h2 data-i18n="beyondTitle"></h2>
    <p data-i18n="beyond"></p>
  </section>

  <hr>
  <p class="note" style="text-align:center" data-i18n="readme"></p>

  <footer>
    <a href="https://github.com/iravan/phone-ime-connect">iravan/phone-ime-connect</a> · MIT / Apache-2.0
  </footer>
</div>

    beyond:"<strong>화면과 커서는 있지만 제대로 된 키보드가 없는 기기</strong>는 모두 같은 입력 문제를 겪습니다: 게임 콘솔(검색·비밀번호·메시지), <strong>노래방 기기</strong>(곡 검색, 특히 중·일·한 곡명은 리모컨으로 사실상 불가능——휴대폰이면 완전한 입력·손글씨·“음성으로 곡명” 검색까지), 스마트 TV, 키오스크, VR, 차량 인포테인먼트. 구현이 저렴하고 기기 무관하며 설치가 필요 없습니다. <strong>화면 키보드를 덜 나쁘게 만들기보다, 휴대폰을 키보드로 삼으세요.</strong><br><br>게다가 <strong>대규모로 배포</strong>할 수도 있습니다: PC 한 대에서 공공 키오스크, 아케이드 기기, 노래방 각 룸, 디지털 사이니지, 시설·차량군 규모의 공용 단말까지. <em>범위: 이 저장소는 데스크톱 버전만 구현합니다. 위의 게임 콘솔·노래방·키오스크·대규모 배포는 개념이며 여기 포함되지 않습니다.</em>",

(function(){
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var have = tabs.map(function(t){return t.dataset.lang;});
  function apply(lang){
    var d = I18N[lang] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = d[el.getAttribute('data-i18n')];
      if(v==null) return;
      // SVG <text>/<title> take plain text; everything else may contain markup.
      if(el.namespaceURI && el.namespaceURI.indexOf('svg')>=0) el.textContent = v;
      else el.innerHTML = v;
    });
    tabs.forEach(function(t){ t.setAttribute('aria-selected', t.dataset.lang===lang); });
    document.documentElement.lang = lang;
    try{ localStorage.setItem('pic_lang', lang); }catch(e){}
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ apply(t.dataset.lang); }); });
  var saved; try{ saved = localStorage.getItem('pic_lang'); }catch(e){}
  var nav = (navigator.language||'en');
  var guess = nav.indexOf('zh')===0 ? (/hant|tw|hk|mo/i.test(nav)?'zh-Hant':'zh-Hans')
            : nav.indexOf('ja')===0 ? 'ja'
            : nav.indexOf('ko')===0 ? 'ko' : 'en';
  apply(have.indexOf(saved)>=0 ? saved : guess);
})();
</script>
