name: Release macOS (Apple Silicon)

# Builds the double-clickable PhoneInputConnect.app for Apple Silicon
# (arm64 -- M1/M2/M3...). Runs on a tag push like `v0.1.0`, or on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to attach the .app to a GitHub Release

jobs:
  build:
    # macOS 14 runners are Apple Silicon, so this produces a native arm64
    # binary that runs on M3.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, aarch64-apple-darwin)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV

      - name: Build PhoneInputConnect.app
        run: ./scripts/build-macos-app.sh

      - name: Zip the app bundle (ditto preserves the code signature)
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            target/release/PhoneInputConnect.app \
            dist/PhoneInputConnect-macos-arm64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneInputConnect-macos-arm64
          path: dist/PhoneInputConnect-macos-arm64.zip

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PhoneInputConnect-macos-arm64.zip
