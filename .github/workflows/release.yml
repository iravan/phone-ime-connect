name: Release

# Builds real Linux packages on real x86_64 infrastructure -- the dev
# machine this project is otherwise built on is aarch64, which can't
# reliably cross-compile a GTK4/libxdo-linked binary for x86_64 (no
# cross-sysroot for those system libraries). The .rpm additionally builds
# inside an actual Fedora container rather than on the Ubuntu host
# directly, since its automatic shared-library dependency detection needs
# to run where the target ecosystem's own packaging conventions live.
# Pushing a `v*` tag publishes both to one GitHub Release;
# workflow_dispatch just builds them as downloadable artifacts, for
# testing without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-input-connect-deb
          path: target/debian/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install git (needed before checkout inside this container)
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        # libxkbcommon-devel: needed since enigo's "libei" feature (native
        # Wayland input support) links against libxkbcommon. Unlike
        # Debian/Ubuntu's libgtk-4-dev, which pulls in libxkbcommon-dev
        # transitively (see build-deb above, which needs no such
        # explicit install), Fedora's gtk4-devel doesn't -- without this,
        # linking fails with "cannot find -lxkbcommon". This was already
        # fixed once (commit cb3642d) and regressed when a later commit
        # added the build-windows job by editing an older copy of this
        # file -- if it goes missing again, that's almost certainly why.
        run: dnf install -y gcc gtk4-devel libxdo-devel libxkbcommon-devel

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-input-connect-rpm
          path: target/generate-rpm/*.rpm

  build-windows:
    # Windows was previously unverified (no Windows machine to build it on
    # at all); it's now confirmed working on real hardware, so it gets a
    # release job like the other two platforms. No extra system packages
    # needed here -- `windows-latest` already ships the MSVC build tools
    # `native-windows-gui` needs, same as a plain `cargo run` locally.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-windows | Out-Null
          Copy-Item target/release/phone-input-connect.exe dist-windows/
          Copy-Item README.md dist-windows/
          Copy-Item LICENSE dist-windows/
          Compress-Archive -Path dist-windows/* -DestinationPath phone-input-connect-windows-x86_64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-input-connect-windows
          path: phone-input-connect-windows-x86_64.zip

  publish:
    needs: [build-deb, build-rpm, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb dist/*.rpm dist/*.zip \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes \
          || gh release upload "${{ github.ref_name }}" dist/*.deb dist/*.rpm dist/*.zip \
            --repo "${{ github.repository }}" --clobber
