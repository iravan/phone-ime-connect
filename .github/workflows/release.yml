name: Release

# Builds real Linux packages on real infrastructure -- a GTK4/libxdo-linked
# binary can't reliably cross-compile between arches (no cross-sysroot for
# those system libraries), so each arch builds natively on its own runner:
# x86_64 on the standard runner and arm64 on GitHub's `ubuntu-*-arm` hosted
# runner. The .rpm additionally builds inside an actual Fedora container
# rather than on the Ubuntu host directly, since its automatic
# shared-library dependency detection needs to run where the target
# ecosystem's own packaging conventions live (the container image is
# multi-arch, so it matches whichever runner it's on).
# Pushing a `v*` tag publishes both to one GitHub Release;
# workflow_dispatch just builds them as downloadable artifacts, for
# testing without cutting a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    # x86_64 and arm64 each build natively (cargo-deb stamps the .deb with
    # the host arch, e.g. _amd64.deb / _arm64.deb).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # Unique per arch: upload-artifact rejects duplicate names.
          name: phone-input-connect-deb-${{ matrix.arch }}
          path: target/debian/*.deb

  build-rpm:
    # x86_64 and arm64 each build natively inside the (multi-arch) Fedora
    # container on their matching runner; cargo-generate-rpm stamps the .rpm
    # with the host arch (e.g. .x86_64.rpm / .aarch64.rpm).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    steps:
      - name: Install git (needed before checkout inside this container)
        run: dnf install -y git

      - uses: actions/checkout@v7

      - name: Install build dependencies
        # libxkbcommon-devel: needed since enigo's "libei" feature (native
        # Wayland input support) links against libxkbcommon. Unlike
        # Debian/Ubuntu's libgtk-4-dev, which pulls in libxkbcommon-dev
        # transitively (see build-deb above, which needs no such
        # explicit install), Fedora's gtk4-devel doesn't -- without this,
        # linking fails with "cannot find -lxkbcommon". This was already
        # fixed once (commit cb3642d) and regressed when a later commit
        # added the build-windows job by editing an older copy of this
        # file -- if it goes missing again, that's almost certainly why.
        run: dnf install -y gcc gtk4-devel libxdo-devel libxkbcommon-devel

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # Unique per arch: upload-artifact rejects duplicate names.
          name: phone-input-connect-rpm-${{ matrix.arch }}
          path: target/generate-rpm/*.rpm

  build-windows:
    # Windows was previously unverified (no Windows machine to build it on
    # at all); it's now confirmed working on real hardware, so it gets a
    # release job like the other two platforms. No extra system packages
    # needed here -- the Windows runners already ship the MSVC build tools
    # `native-windows-gui` needs, same as a plain `cargo run` locally.
    #
    # Both arches build natively (no cross-compiling): x86_64 on the
    # standard runner, arm64 on GitHub's `windows-11-arm` hosted runner, so
    # each toolchain targets its own host (`*-pc-windows-msvc`) with no
    # `--target` flag or ARM64 cross linker to set up. `fail-fast: false`
    # keeps a hiccup on one arch from cancelling the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          # Version the zip name (e.g. phone-input-connect-0.4.8-windows-arm64.zip)
          # so a downloaded file is self-identifying. .deb/.rpm already carry
          # the version via cargo's own naming; this matches them.
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Path dist-windows | Out-Null
          Copy-Item target/release/phone-input-connect.exe dist-windows/
          Copy-Item README.md dist-windows/
          Copy-Item LICENSE dist-windows/
          Compress-Archive -Path dist-windows/* -DestinationPath "phone-input-connect-$version-windows-${{ matrix.arch }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          # Unique per arch: upload-artifact rejects duplicate names.
          name: phone-input-connect-windows-${{ matrix.arch }}
          path: phone-input-connect-*-windows-${{ matrix.arch }}.zip

  publish:
    needs: [build-deb, build-rpm, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb dist/*.rpm dist/*.zip \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes \
          || gh release upload "${{ github.ref_name }}" dist/*.deb dist/*.rpm dist/*.zip \
            --repo "${{ github.repository }}" --clobber
