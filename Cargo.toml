[package]
name = "phone-input-connect"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.13"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
enigo = "0.2"
arboard = "3"
directories = "5"
log = "0.4"
env_logger = "0.11"

# The primary UI is a native window built on each platform's own toolkit
# (see the README's "Platform notes" -- Windows/macOS don't have their
# native window implemented yet and fall back to a tray icon + browser
# tab in the meantime, hence webbrowser/tray-icon/winit staying
# non-Linux-only below).
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.11", features = ["v4_6"] }
async-channel = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.19"
winit = "0.30"
# Windows/macOS native window: an embedded webview (WKWebView / WebView2)
# rendering the dashboard, driven in-process via its IPC bridge -- no
# external browser, no loopback HTTP round-trip.
wry = "0.56"
