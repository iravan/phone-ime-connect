[package]
name = "phonechat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.13"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
enigo = "0.2"
arboard = "3"
directories = "5"
log = "0.4"
env_logger = "0.11"
webbrowser = "1"

# Tray icon backend is platform-specific: ksni implements the
# StatusNotifierItem D-Bus protocol directly in pure Rust, needing no
# system dev packages to build (unlike tray-icon's Linux backend, which
# needs glib2-devel/gtk3-devel at build time -- see README). Windows and
# macOS use tray-icon's native Win32/Cocoa backends instead, which have no
# such system-package requirement on those platforms.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.19"
winit = "0.30"
